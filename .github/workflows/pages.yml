name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued deploy wait for the running one rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Runs alongside build rather than gating it: a kernel regression should be
  # reported, but it can't break a page that tsc and vite already accepted.
  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `cache: npm` here. The node_modules cache below already covers this
      # job, and racing `build` for the same ~/.npm key just logs a save failure.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The runner has no GPU, so Dawn needs a software Vulkan ICD (lavapipe).
      - run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      # node_modules whole, not just ~/.npm: @kmamal/gpu pulls a ~16MB Dawn
      # binary straight into its own dist/ from a postinstall step, so the npm
      # tarball cache doesn't cover it and `npm ci` would wipe any narrower
      # cache path before the install could benefit from it.
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # --strict on both: no adapter is a broken runner, not a reason to pass
      # quietly. Shaders first — every kernel check would fail for the same
      # reason if a module stopped compiling, and that message is the useful one.
      - run: npm run check:shaders -- --strict
      - run: npm run check:kernels -- --strict
      # Needs no GPU — the druid backends are plain JS. It rides in this job
      # anyway because it is a behaviour check, and the comment above applies to
      # it identically: report a regression, don't break an accepted page.
      - run: npm run check:druid

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
